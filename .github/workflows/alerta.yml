name: Notificacion CI Practica 4

# El trigger que activa el flujo de trabajo
on:
  push:
    branches:
      - main

jobs:
  construir_y_notificar:
    # Máquina virtual donde se ejecutará el pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repositorio en la máquina virtual
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Node.js para poder correr JavaScript
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Ejecutar el archivo del programa
      - name: Ejecutar Hola Mundo
        run: node index.js

      # 4. Envíar la notificación HTTP a ntfy.sh usando curl
      - name: Enviar alerta a ntfy
        run: |
          curl -d "✅ Se ha subido un nuevo commit a la rama main. Practica 4 completada." ntfy.sh/devops-itla
